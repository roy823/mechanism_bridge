{% extends 'page.html' %}{% block body %}<div class="eyebrow">Physical event library</div><h1>物理事件与真实分子轨迹</h1><p class="lead">选择一条记录，查看其自己的坐标和能量。关联 DFT 通过不会把原来的 MLIP 轨迹改标成 DFT。</p><div class="toolbar"><label>阶段 <select id="stageFilter" aria-label="筛选实验阶段"><option value="">全部阶段</option>{% for s in stages %}<option value="{{ s.id }}">{{ s.short }} · {{ s.title }}</option>{% endfor %}<option value="feasibility">历史量化原型</option></select></label><label>证据 <select id="evidenceFilter" aria-label="筛选证据等级"><option value="">全部证据</option><option value="DFT_IRC">DFT / IRC 实际轨迹</option><option value="MLIP_DESCENT">MLIP 双侧下降</option></select></label><input id="eventSearch" type="search" aria-label="搜索物理事件" placeholder="搜索名称、SMILES、起点或策略"><span id="eventCount" class="muted" aria-live="polite"></span></div>
<div class="event-layout"><aside id="eventList" class="event-list" aria-label="事件列表"></aside><section><div class="event-heading" id="selectionLabel"></div><iframe id="eventFrame" class="event-frame" title="实际分子结构与反应路径"></iframe><div id="emptyState" class="empty" hidden>没有符合筛选条件的事件。未收敛和不支持的案例请查看实验运行表。</div></section></div>{% endblock %}
{% block scripts %}<script>const EVENTS={{ events_json|safe }};const qs=new URLSearchParams(location.search);const stage=document.getElementById('stageFilter'),evidence=document.getElementById('evidenceFilter'),search=document.getElementById('eventSearch'),list=document.getElementById('eventList'),frame=document.getElementById('eventFrame');stage.value=qs.get('stage')||'';evidence.value=qs.get('evidence')||'';let selected='';
function selectEvent(e){selected=e.id;frame.src=e.view+'?embed=1';frame.hidden=false;document.getElementById('emptyState').hidden=true;document.getElementById('selectionLabel').textContent=e.title+' · '+e.evidence_label;list.querySelectorAll('button').forEach(b=>b.classList.toggle('selected',b.dataset.id===e.id));}
function filterEvents(){const text=search.value.trim().toLowerCase();const items=EVENTS.filter(e=>(!stage.value||e.stage===stage.value)&&(!evidence.value||e.evidence===evidence.value)&&(!text||[e.title,e.start,e.left_smiles,e.right_smiles,e.strategy_label].join(' ').toLowerCase().includes(text)));list.replaceChildren();document.getElementById('eventCount').textContent=items.length+' 条事件记录';for(const e of items){const b=document.createElement('button');b.className='event-button';b.dataset.id=e.id;b.textContent=e.title;const sub=document.createElement('small');sub.textContent=e.stage_short+' · '+e.evidence_label+' · '+e.strategy_label;b.append(sub);const identity=document.createElement('small');identity.textContent=e.case_label;identity.style.overflowWrap='anywhere';b.append(identity);b.onclick=()=>selectEvent(e);list.append(b);}if(items.length){selectEvent(items.find(e=>e.id===selected)||items[0]);}else{frame.removeAttribute('src');frame.hidden=true;document.getElementById('emptyState').hidden=false;document.getElementById('selectionLabel').textContent='';}}
window.addEventListener('message',e=>{if(e.source===frame.contentWindow&&e.data.type==='mechbridge-height')frame.style.height=Math.max(800,Math.min(7000,e.data.height))+'px';});stage.onchange=filterEvents;evidence.onchange=filterEvents;search.oninput=filterEvents;filterEvents();</script>{% endblock %}
